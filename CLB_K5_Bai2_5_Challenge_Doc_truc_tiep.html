báu, nhận điểm và chiến thắng khi thu thập đủ số rương yêu cầu.</p>\n<p>Nếu chỉ nghĩ “Mình phải làm cả trò chơi!”, nhiệm vụ có vẻ rất lớn. Em có thể chăm chút hình ảnh thật lâu nhưng lại quên cách tính điểm; hoặc viết xong phần di chuyển mà chưa biết khi nào trò chơi kết thúc.</p>\n<p>Người giải quyết vấn đề có kế hoạch sẽ nhìn sản phẩm dưới nhiều phần việc: cần có nhân vật, nơi chơi, kho báu, cách ghi nhận kết quả và quy tắc chiến thắng. Khi mỗi phần việc rõ ràng, em sẽ biết nên bắt đầu từ đâu và có thể kiểm tra từng phần.</p>\n<div class=\"rd-callout\"><strong>Ý TƯỞNG CỐT LÕI</strong><span>Đừng cố giải quyết mọi thứ cùng lúc. Hãy nhìn rõ các phần của vấn đề trước, rồi giải quyết từng phần và kết nối chúng lại.</span></div>\n<h2 id=\"chuong-2\" class=\"rd-chapter\">2.  Phân rã bài toán là gì?</h2>\n<p>Phân rã bài toán (Decomposition) là quá trình chia một vấn đề, nhiệm vụ hoặc sản phẩm lớn thành những nhiệm vụ nhỏ hơn, rõ ràng hơn và dễ giải quyết hơn. Đây là một cách tư duy quan trọng trong Tin học, đặc biệt trước khi thiết kế thuật toán hoặc lập trình.</p>\n<h3 class=\"rd-section\">Một ví dụ rất gần gũi</h3>\n<p>Nhiệm vụ “Tổ chức ngày hội của lớp” nghe có vẻ rộng. Ta có thể chia thành các phần: nội dung chương trình, địa điểm và trang trí, vật dụng cần thiết, thông báo và đón khách. Phần “nội dung chương trình” lại có thể chia tiếp thành chọn các hoạt động, sắp xếp người phụ trách và chuẩn bị lời giới thiệu.</p>\n<p>Không phải phần nào cũng cần chia nhỏ đến cùng. Ta dừng khi mỗi phần đủ cụ thể để biết phải làm gì và kết quả hoàn thành sẽ như thế nào.</p>\n<h3 class=\"rd-section\">Phân rã mang lại những lợi ích nào?</h3>\n<p class=\"rd-bullet\">Dễ bắt đầu: một nhiệm vụ nhỏ thường ít gây lúng túng hơn một nhiệm vụ rất lớn.</p>\n<p class=\"rd-bullet\">Giảm bỏ sót: danh sách các phần việc giúp đối chiếu với yêu cầu của sản phẩm.</p>\n<p class=\"rd-bullet\">Dễ tìm và sửa lỗi: khi một chức năng không đúng, ta có thể xem lại chính phần liên quan.</p>\n<p class=\"rd-bullet\">Dễ phối hợp: nếu làm theo nhóm, các bạn có thể nhận nhiệm vụ rõ ràng rồi kết nối kết quả.</p>\n<div class=\"rd-callout\"><strong>LƯU Ý QUAN TRỌNG</strong><span>Phân rã không có nghĩa là các phần nhỏ tự động giải quyết được bài toán. Sau khi chia việc, em vẫn cần suy nghĩ cách thực hiện, thử nghiệm và sửa lỗi.</span></div>\n<h2 id=\"chuong-3\" class=\"rd-chapter\">3.  Nhiệm vụ chính và nhiệm vụ con</h2>\n<p>Một sản phẩm lớn được chia thành các nhóm việc quan trọng gọi là nhiệm vụ chính. Mỗi nhiệm vụ chính có thể được chia tiếp thành những nhiệm vụ con cụ thể. Một nhiệm vụ con, nếu vẫn còn quá rộng, lại có thể chia thành các việc nhỏ hơn nữa.</p>\n<h3 class=\"rd-section\">Nhìn vấn đề theo nhiều cấp độ</h3>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Cấp độ</th><th>Ví dụ trong trò chơi</th><th>Ý nghĩa</th></tr><tr><td>Cấp 0 – Sản phẩm</td><td>Trò chơi “Thu thập kho báu”</td><td>Kết quả cuối cùng cần xây dựng.</td></tr><tr><td>Cấp 1 – Nhiệm vụ chính</td><td>Điều khiển nhân vật</td><td>Một chức năng lớn cần có trong trò chơi.</td></tr><tr><td>Cấp 2 – Nhiệm vụ con</td><td>Chọn nhân vật; điều khiển bằng phím; kiểm tra va chạm tường</td><td>Những việc cụ thể để chức năng đó hoạt động.</td></tr></table></div>\n<p>Ví dụ, “điều khiển nhân vật” là một nhiệm vụ chính. Trong đó, “nhân vật di chuyển khi nhấn phím mũi tên” là một nhiệm vụ con. Nếu em chưa biết cách làm phần “di chuyển”, em có thể chia tiếp thành: nhận phím bấm, xác định hướng đi và thay đổi vị trí nhân vật.</p>\n<div class=\"rd-callout\"><strong>ĐIỂM CẦN PHÂN BIỆT</strong><span>Nhiệm vụ chính trả lời “Sản phẩm cần những phần chức năng lớn nào?”. Nhiệm vụ con trả lời “Để hoàn thành phần chức năng đó, cần những việc cụ thể nào?”.</span></div>\n<h2 id=\"chuong-4\" class=\"rd-chapter\">4.  Một quy trình phân rã dễ áp dụng</h2>\n<p>Không có một công thức duy nhất cho mọi bài toán. Tuy nhiên, bốn bước sau giúp em phân rã có kế hoạch và dễ kiểm tra.</p>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Bước</th><th>Cần làm gì?</th><th>Ví dụ ngắn</th></tr><tr><td>1. Hiểu nhiệm vụ</td><td>Xác định sản phẩm phải làm được điều gì, đâu là yêu cầu bắt buộc.</td><td>Người chơi di chuyển, nhặt 3 rương, nhận điểm và được báo thắng.</td></tr><tr><td>2. Xác định phần chính</td><td>Nhóm các yêu cầu thành các chức năng hoặc phần việc lớn.</td><td>Màn hình; nhân vật; kho báu; điểm số; kết thúc.</td></tr><tr><td>3. Chia nhỏ tiếp</td><td>Với phần còn quá rộng, liệt kê các việc cụ thể hơn.</td><td>Kho báu → tạo rương; phát hiện chạm; làm rương biến mất.</td></tr><tr><td>4. Kiểm tra và sắp xếp</td><td>Đối chiếu lại yêu cầu; xem nhiệm vụ đã rõ chưa, phần nào phụ thuộc phần nào.</td><td>Muốn báo thắng khi đủ điểm thì cần có cách ghi nhận điểm.</td></tr></table></div>\n<h3 class=\"rd-section\">Làm sao biết đã chia đủ nhỏ?</h3>\n<p>Một nhiệm vụ đủ nhỏ là nhiệm vụ mà em có thể mô tả rõ mục đích, hình dung cách thực hiện và nhận biết khi nào nó hoàn thành. Ví dụ, “làm trò chơi thật hấp dẫn” còn quá mơ hồ; “phát âm thanh khi nhặt được rương báu” đã rõ hơn nhiều.</p>\n<p>Không nên chia vụn đến mức mất đi ý nghĩa của công việc. Việc “nhấp chuột vào một ô lệnh” thường chỉ là một thao tác khi lập trình, chưa nhất thiết phải trở thành một nhiệm vụ riêng trong sơ đồ phân rã.</p>\n<h2 id=\"chuong-5\" class=\"rd-chapter\">5.  Ví dụ xuyên suốt: Trò chơi “Thu thập kho báu”</h2>\n<h3 class=\"rd-section\">5.1. Đọc kỹ yêu cầu trước khi chia</h3>\n<p>Trong ví dụ này, trò chơi có những yêu cầu cụ thể: (1) có sân khấu và nhân vật; (2) nhân vật di chuyển bằng phím mũi tên; (3) có 3 rương báu trên sân khấu; (4) khi chạm một rương chưa được nhặt, người chơi nhận 1 điểm và rương đó biến mất; (5) khi thu thập đủ 3 rương, trò chơi hiển thị thông báo chiến thắng.</p>\n<p>Ta chưa cần biết từng khối lệnh Scratch sẽ viết thế nào. Điều quan trọng trước tiên là nhìn thấy toàn bộ những gì trò chơi cần làm.</p>\n<h3 class=\"rd-section\">5.2. Sơ đồ phân rã cấp 1 và cấp 2</h3>\n<figure class=\"rd-fig AAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDsErwEAAAAAAAAAskPwGgAAAAAAAAAgOwSvAQAAAAAAAACyQ/AaAAAAAAAAACA7BK8BAAAAAAAAALJD8BoAAAAAAAAAIDv/A9LlfMADyMKpAAAAAElFTkSuQmCC\"></figure>\n<p>Sơ đồ minh họa: một sản phẩm lớn được chia thành 5 chức năng, rồi chia tiếp thành các việc nhỏ.</p>\n<h3 class=\"rd-section\">5.3. Phân tích các nhiệm vụ cụ thể hơn</h3>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Nhiệm vụ chính</th><th>Nhiệm vụ con</th><th>Kết quả cần đạt</th></tr><tr><td>A. Màn hình chơi</td><td>A1. Chọn sân khấu.<br>A2. Chuẩn bị trạng thái bắt đầu.</td><td>Người chơi thấy khu vực chơi và có thể bắt đầu.</td></tr><tr><td>B. Nhân vật</td><td>B1. Chọn nhân vật.<br>B2. Cho di chuyển bằng phím.<br>B3. Giữ nhân vật trong khu vực hợp lệ.</td><td>Người chơi điều khiển được nhân vật.</td></tr><tr><td>C. Kho báu</td><td>C1. Tạo 3 rương báu.<br>C2. Xác định khi nhân vật chạm rương.<br>C3. Làm rương đã nhặt biến mất.</td><td>Rương chỉ được thu thập một lần.</td></tr><tr><td>D. Điểm số</td><td>D1. Điểm khởi đầu là 0.<br>D2. Mỗi rương hợp lệ cộng 1 điểm.<br>D3. Hiển thị điểm cho người chơi.</td><td>Điểm phản ánh đúng số rương đã nhặt.</td></tr><tr><td>E. Kết thúc</td><td>E1. Xác định điều kiện đủ 3 điểm.<br>E2. Hiển thị thông báo thắng.<br>E3. Dừng hoặc chuyển sang màn kết thúc.</td><td>Trò chơi kết thúc đúng khi đạt mục tiêu.</td></tr></table></div>\n<h3 class=\"rd-section\">5.4. Vì sao các nhiệm vụ phải kết nối với nhau?</h3>\n<p>Mỗi phần có thể hoạt động riêng nhưng trò chơi chỉ hoàn chỉnh khi chúng phối hợp. Ví dụ, phần “nhân vật” giúp di chuyển; phần “kho báu” nhận biết khi chạm; phần “điểm số” ghi nhận kết quả; phần “kết thúc” dựa vào điểm để xác định thắng.</p>\n<p>Nếu rương đã nhặt không biến mất, nhân vật có thể chạm lại rương nhiều lần và điểm tăng sai. Nhờ sơ đồ phân rã, em biết cần kiểm tra phần thu thập và phần ghi điểm, thay vì sửa toàn bộ trò chơi một cách ngẫu nhiên.</p>\n<div class=\"rd-callout\"><strong>KẾT NỐI VỚI SCRATCH</strong><span>Tên nhiệm vụ trong sơ đồ là mô tả việc cần làm, chưa phải tên khối lệnh. Khi lập trình, em mới lựa chọn nhóm lệnh phù hợp như Sự kiện, Chuyển động, Cảm biến, Điều khiển và các công cụ lưu điểm đã hoặc sẽ học.</span></div>\n<h2 id=\"chuong-6\" class=\"rd-chapter\">6.  Thế nào là một cách phân rã hợp lý?</h2>\n<p>Hai học sinh có thể chia cùng một trò chơi theo hai sơ đồ khác nhau. Điều quan trọng không phải sơ đồ nào có nhiều ô hơn, mà là sơ đồ đó giúp hiểu rõ và giải quyết đầy đủ vấn đề hay không.</p>\n<h3 class=\"rd-section\">Bốn tiêu chí: ĐỦ – RÕ – VỪA – KẾT NỐI</h3>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Tiêu chí</th><th>Dấu hiệu của một cách phân rã tốt</th><th>Ví dụ cần chú ý</th></tr><tr><td>ĐỦ</td><td>Các nhiệm vụ bao quát mọi yêu cầu quan trọng.</td><td>Trò chơi có tính điểm thì sơ đồ không thể quên việc ghi điểm.</td></tr><tr><td>RÕ</td><td>Tên nhiệm vụ cho biết việc cụ thể phải làm và kết quả cần đạt.</td><td>“Hiển thị thông báo thắng” rõ hơn “làm phần cuối”.</td></tr><tr><td>VỪA</td><td>Nhiệm vụ không quá lớn, cũng không chia vụn vô ích.</td><td>“Xử lý mọi tương tác” nên chia tiếp; thao tác kéo một khối lệnh chưa cần là nhiệm vụ riêng.</td></tr><tr><td>KẾT NỐI</td><td>Các phần có quan hệ rõ và có thể ghép thành sản phẩm.</td><td>Phần ghi điểm cần nhận tín hiệu từ việc nhặt kho báu.</td></tr></table></div>\n<p>Một cách chia ban đầu chưa hoàn hảo vẫn có thể được cải tiến. Khi đọc lại yêu cầu hoặc thử xây dựng sản phẩm, em có thể phát hiện nhiệm vụ bị thiếu, trùng lặp hoặc chưa rõ rồi sửa sơ đồ.</p>\n<h2 id=\"chuong-7\" class=\"rd-chapter\">7.  Những cách phân rã dễ mắc lỗi</h2>\n<h3 class=\"rd-section\">Lỗi 1. Chia quá chung chung</h3>\n<p>Chưa rõ: “Làm phần chơi”, “làm cho hấp dẫn”, “hoàn thiện”. Đây là các cụm từ rộng, chưa cho biết chức năng cần làm.</p>\n<p>Rõ hơn: “Điều khiển nhân vật bằng phím”, “phát tiếng động khi nhặt rương”, “báo thắng khi đủ 3 điểm”.</p>\n<h3 class=\"rd-section\">Lỗi 2. Chăm chút chi tiết nhưng bỏ sót yêu cầu</h3>\n<p>Một bạn chia trò chơi thành: chọn màu phông nền, đổi trang phục nhân vật, thêm nhạc và vẽ rương thật đẹp. Các công việc này có ích, nhưng bạn chưa liệt kê cách nhặt rương, ghi điểm và xác định thắng. Sơ đồ đẹp nhưng chưa đủ chức năng.</p>\n<h3 class=\"rd-section\">Lỗi 3. Lẫn nhiệm vụ với thứ tự thao tác</h3>\n<p>“Bấm nút màu vàng → kéo khối lệnh → nhập số 10” có thể là các thao tác khi làm trên Scratch. Chúng chưa nói rõ chức năng của sản phẩm. Trong sơ đồ phân rã, nên ưu tiên các nhiệm vụ có ý nghĩa như “điều khiển nhân vật di chuyển 10 bước”.</p>\n<h3 class=\"rd-section\">Lỗi 4. Các phần không khớp nhau</h3>\n<p>Phần tính điểm dự định cộng 1 khi chạm rương, nhưng phần kho báu lại tạo rương liên tục mà không phân biệt rương đã nhặt. Khi kết nối, điểm có thể sai. Vì vậy, ngoài việc chia đúng, em còn phải xác định các phần trao đổi kết quả với nhau ra sao.</p>\n<div class=\"rd-callout\"><strong>GHI NHỚ</strong><span>Phân rã là công cụ giúp hiểu bài toán, không phải cuộc thi chia được nhiều ô nhất. Một sơ đồ gọn và đúng yêu cầu thường hữu ích hơn một sơ đồ dài nhưng mơ hồ.</span></div>\n<h2 id=\"chuong-8\" class=\"rd-chapter\">8.  Phân rã khác gì với tư duy thuật toán ở Bài 1?</h2>\n<p>Bài 1 đã giới thiệu tư duy thuật toán: mô tả các bước có thứ tự để giải quyết nhiệm vụ. Bài 2 bổ sung một câu hỏi xuất hiện sớm hơn: nhiệm vụ lớn gồm những phần việc nào?</p>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Phân rã bài toán – Bài 2</th><th>Tư duy thuật toán – Bài 1</th></tr><tr><td>Tập trung vào các phần cấu thành của vấn đề.</td><td>Tập trung vào các bước và thứ tự giải quyết một nhiệm vụ.</td></tr><tr><td>Câu hỏi chính: “Cần giải quyết những phần việc nào?”.</td><td>Câu hỏi chính: “Cần thực hiện bước nào trước, bước nào sau?”.</td></tr><tr><td>Ví dụ: “Thu thập kho báu” có các phần phát hiện chạm, ghi điểm và xử lí rương đã nhặt.</td><td>Ví dụ: Khi chạm rương chưa nhặt → ghi nhận 1 điểm → làm rương biến mất.</td></tr></table></div>\n<h3 class=\"rd-section\">Hai cách tư duy bổ sung cho nhau</h3>\n<p>Hãy hình dung nhiệm vụ “Điều khiển nhân vật”. Phân rã giúp tách thành: nhận phím bấm, đổi vị trí nhân vật và giới hạn khu vực di chuyển. Sau đó, tư duy thuật toán giúp em xác định chính xác các bước xử lý khi một phím được nhấn.</p>\n<p>Có thể tóm tắt: phân rã giúp biết cần làm những việc gì; thuật toán giúp biết mỗi việc phải được giải quyết như thế nào, theo trình tự ra sao. Trong quá trình thiết kế, nếu thuật toán cho thấy một nhiệm vụ quá rộng, em có thể quay lại chia nhỏ hơn.</p>\n<div class=\"rd-callout\"><strong>LIÊN HỆ VỚI INPUT – PROCESS – OUTPUT</strong><span>Ví dụ “di chuyển nhân vật”: đầu vào là phím bấm; xử lý là xác định hướng và cập nhật vị trí; đầu ra là nhân vật di chuyển trên màn hình. IPO giúp mô tả một nhiệm vụ con sau khi đã phân rã.</span></div>\n<h2 id=\"chuong-9\" class=\"rd-chapter\">9.  Từ sơ đồ phân rã đến kế hoạch xây dựng</h2>\n<p>Sau khi xác định các nhiệm vụ, em có thể quyết định việc nào nên triển khai trước. Đây là bước lập kế hoạch dựa trên sơ đồ phân rã, chứ không phải bản thân thao tác phân rã.</p>\n<h3 class=\"rd-section\">Hiểu mối quan hệ phụ thuộc</h3>\n<p>Một số việc có thể làm tương đối độc lập, ví dụ chọn phông nền và chọn hình nhân vật. Một số việc phụ thuộc vào kết quả của phần khác. Ví dụ, để kiểm tra “đủ 3 điểm thì thắng”, trò chơi phải có cách tính và cập nhật điểm trước.</p>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Giai đoạn gợi ý</th><th>Việc cần hoàn thành</th><th>Lý do sắp xếp</th></tr><tr><td>1. Khung trò chơi</td><td>Chuẩn bị sân khấu và cho nhân vật di chuyển.</td><td>Có môi trường để kiểm tra tương tác.</td></tr><tr><td>2. Tương tác</td><td>Đặt rương, phát hiện chạm, xử lý rương đã nhặt.</td><td>Xác nhận người chơi thực sự thu thập được vật phẩm.</td></tr><tr><td>3. Kết quả</td><td>Ghi nhận điểm và hiển thị điểm.</td><td>Biết số rương đã thu thập.</td></tr><tr><td>4. Luật thắng</td><td>Kiểm tra đạt 3 điểm và thông báo chiến thắng.</td><td>Dựa trên kết quả của phần ghi điểm.</td></tr><tr><td>5. Kiểm tra toàn bộ</td><td>Chơi thử từ đầu đến cuối, sửa các vấn đề phát hiện được.</td><td>Kiểm tra các chức năng phối hợp.</td></tr></table></div>\n<p>Đây chỉ là một thứ tự hợp lý, không phải thứ tự duy nhất. Em có thể thử nghiệm chức năng ghi điểm bằng một nút bấm trước khi hoàn thiện nhân vật, miễn là hiểu rõ đang kiểm tra phần nào và sẽ kết nối thế nào.</p>\n<h2 id=\"chuong-10\" class=\"rd-chapter\">10.  Một bài toán có thể có nhiều cách phân rã</h2>\n<p>Có thể phân rã theo chức năng của sản phẩm, theo đối tượng trong trò chơi hoặc theo nhóm công việc. Mỗi cách chia làm nổi bật một góc nhìn khác nhau.</p>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Cách nhìn</th><th>Một cách phân rã có thể dùng</th><th>Khi nào hữu ích?</th></tr><tr><td>Theo chức năng</td><td>Di chuyển; thu thập; điểm số; chiến thắng.</td><td>Khi cần kiểm tra trò chơi đã đáp ứng những chức năng nào.</td></tr><tr><td>Theo đối tượng Scratch</td><td>Nhân vật; rương báu; sân khấu; thông báo.</td><td>Khi phân công xây dựng hoặc tìm vị trí mã lệnh trong từng đối tượng.</td></tr><tr><td>Theo nhóm công việc</td><td>Thiết kế hình ảnh; xây dựng tương tác; kiểm thử.</td><td>Khi làm việc nhóm hoặc lên kế hoạch thực hiện.</td></tr></table></div>\n<p>Không có nghĩa ba sơ đồ trên thay thế nhau hoàn toàn. Chẳng hạn, nếu chỉ chia theo đối tượng Scratch, chức năng “ghi điểm” có thể liên quan đến nhiều đối tượng và dễ bị bỏ sót. Vì vậy, dù chọn cách nào, em vẫn phải đối chiếu lại các yêu cầu bắt buộc.</p>\n<h3 class=\"rd-section\">Ví dụ mở rộng: Trò chơi “Robot giao hàng”</h3>\n<p>Giả sử robot phải nhận một kiện hàng, đi qua chướng ngại vật và giao hàng đến đích. Một cách phân rã theo chức năng có thể gồm: điều khiển robot; nhận kiện hàng; xử lý vật cản; xác định vị trí giao; báo hoàn thành.</p>\n<p>Riêng nhiệm vụ “nhận kiện hàng” có thể chia thành: hiển thị kiện hàng, kiểm tra robot đến gần kiện hàng và thay đổi trạng thái kiện hàng thành “đã nhận”. Tình huống này cho thấy cùng một cách tư duy phân rã có thể áp dụng cho nhiều trò chơi khác nhau, không phụ thuộc vào tên nhân vật hay hình ảnh.</p>\n<h2 id=\"chuong-11\" class=\"rd-chapter\">11.  Nhớ đúng bản chất của phân rã bài toán</h2>\n<p>Trước khi lập trình một sản phẩm, em nên hiểu yêu cầu của sản phẩm, tìm ra những chức năng hoặc phần việc chính, chia tiếp các phần còn quá rộng và kiểm tra xem các nhiệm vụ có đầy đủ, rõ ràng, vừa sức và kết nối với nhau hay không.</p>\n<div class=\"rd-callout\"><strong>SƠ ĐỒ TƯ DUY CUỐI BÀI</strong><span>VẤN ĐỀ LỚN  →  NHIỆM VỤ CHÍNH  →  NHIỆM VỤ CON  →  KIỂM TRA &amp; SẮP XẾP  →  THIẾT KẾ THUẬT TOÁN / LẬP TRÌNH</span></div>\n<h3 class=\"rd-section\">Từ khóa quan trọng</h3>\n<div class=\"rd-table-wrap\"><table class=\"rd-table\"><tr><th>Từ khóa</th><th>Ý nghĩa ngắn gọn</th></tr><tr><td>Decomposition – Phân rã</td><td>Chia vấn đề lớn thành những phần nhỏ, rõ ràng và có thể giải quyết.</td></tr><tr><td>Nhiệm vụ chính</td><td>Một phần việc lớn hoặc chức năng quan trọng của sản phẩm.</td></tr><tr><td>Nhiệm vụ con</td><td>Việc cụ thể hơn để hoàn thành một nhiệm vụ chính.</td></tr><tr><td>Sơ đồ phân rã</td><td>Cách biểu diễn vấn đề lớn và các nhiệm vụ con theo nhiều cấp.</td></tr><tr><td>Quan hệ phụ thuộc</td><td>Một nhiệm vụ cần kết quả từ nhiệm vụ khác để hoạt động đầy đủ.</td></tr></table></div>\n<p>Điều quan trọng nhất em cần mang theo sang phần thực hành: Một sản phẩm phức tạp sẽ trở nên dễ tiếp cận hơn khi em hiểu nó được tạo nên từ những phần nào và các phần đó phối hợp ra sao.</p>\n<h3 class=\"rd-section\">Giải đáp những điều dễ nhầm</h3>\n<p>“Càng nhiều nhiệm vụ con càng tốt” có đúng không?  Không. Chia quá ít thì khó thực hiện, nhưng chia quá vụn sẽ khiến sơ đồ rối. Mục tiêu là chia đến mức mỗi nhiệm vụ có ý nghĩa rõ ràng và có thể triển khai.</p>\n<p>“Chưa biết dùng khối lệnh Scratch thì không thể phân rã” có đúng không?  Không. Phân rã bắt đầu từ yêu cầu và chức năng của sản phẩm. Em có thể biết cần phát hiện việc nhân vật chạm rương báu ngay cả khi chưa học khối lệnh cụ thể để làm điều đó.</p>\n<p>“Một bài toán chỉ có một sơ đồ phân rã đúng” có đúng không?  Không nhất thiết. Hai sơ đồ khác nhau vẫn có thể hợp lý nếu đều bao quát yêu cầu, đủ rõ, vừa sức và chỉ ra cách các phần phối hợp với nhau.</p>\n<p>“Đã vẽ sơ đồ rồi thì không được sửa” có đúng không?  Không. Khi tìm thấy yêu cầu bị thiếu hoặc khi một nhiệm vụ còn quá lớn, người lập trình có thể quay lại điều chỉnh sơ đồ. Cải tiến kế hoạch là một phần của quá trình giải quyết vấn đề.</p>";

 {id:'maze',n:1,title:'Mê cung bí ẩn',short:'Tìm chìa khóa, vượt bẫy và mở cánh cửa thoát.',type:'Trò chơi phiêu lưu',stars:3,stage:'Khá',image:0,
 scenario:'Một nhóm học sinh muốn tạo trò chơi Scratch mang tên “Mê cung bí ẩn”. Người chơi phải tìm đường trong mê cung, thu thập chìa khóa và thoát ra khỏi lâu đài trước khi mất hết mạng.',
 paragraphs:[
 'Khi nhấn cờ xanh, trò chơi hiển thị một mê cung có lối đi, tường, ba chìa khóa ở các vị trí khác nhau, một số ô bẫy và cánh cửa thoát ở cuối đường. Nhân vật xuất hiện tại vị trí bắt đầu với 3 mạng sống; số chìa khóa đã tìm được hiển thị là 0.',
 'Người chơi sử dụng các phím mũi tên để điều khiển nhân vật. Nhân vật chỉ được đi trong lối đi hợp lệ, không thể đi xuyên qua tường. Khi chạm một chìa khóa chưa nhặt, chìa khóa đó biến mất và số chìa khóa đã thu thập tăng thêm 1. Một chìa khóa không được tính nhiều lần.',
 'Nếu nhân vật bước vào ô bẫy, số mạng giảm 1 và nhân vật quay về vị trí bắt đầu. Khi vẫn còn mạng, người chơi tiếp tục hành trình và giữ nguyên những chìa khóa đã thu thập. Nếu số mạng giảm về 0, màn hình thông báo “Thất bại” và dừng lượt chơi.',
 'Cánh cửa thoát vẫn đóng nếu người chơi chưa đủ ba chìa khóa. Khi đã thu thập đủ ba chìa khóa và đi tới cửa, cửa mở, nhân vật được phép đi qua, màn hình hiện “Chiến thắng!” và kết thúc lượt chơi. Người chơi có thể nhấn nút “Chơi lại” để bắt đầu từ đầu với các giá trị ban đầu.'
 ], twist:'Ban tổ chức muốn bổ sung đồng hồ đếm ngược 90 giây. Nếu hết giờ mà nhân vật chưa thoát, lượt chơi kết thúc. Em cần điều chỉnh những phần nào trong sơ đồ?'},
 {id:'quiz',n:2,title:'Quiz thông minh',short:'Trả lời câu hỏi, nhận phản hồi và xem kết quả.',type:'Ứng dụng học tập',stars:3,stage:'Khá',image:1,
 scenario:'Câu lạc bộ cần một chương trình Scratch để học sinh lớp 5 ôn kiến thức bằng trò chơi hỏi đáp. Em được giao thiết kế một bài Quiz có thể theo dõi điểm số và thông báo kết quả cuối cùng.',
 paragraphs:[
 'Khi mở chương trình, người chơi nhìn thấy màn hình chào mừng, tên bài Quiz và nút “Bắt đầu”. Sau khi bấm nút này, câu hỏi đầu tiên xuất hiện cùng bốn phương án A, B, C, D. Bộ Quiz có tổng cộng 5 câu hỏi và mỗi câu chỉ có một phương án đúng.',
 'Người chơi nhấp vào một phương án để trả lời. Chương trình chỉ ghi nhận lựa chọn đầu tiên cho câu hiện tại. Nếu đúng, người chơi nhận 20 điểm và màn hình hiện lời khen; nếu sai, điểm không tăng và màn hình hiển thị thông báo để người chơi biết mình trả lời chưa đúng.',
 'Sau khi nhận phản hồi, người chơi bấm nút “Câu tiếp theo” để chuyển sang câu kế tiếp. Trong suốt quá trình, màn hình cho biết người chơi đang làm câu số mấy trên tổng số 5 câu và số điểm hiện có. Một câu hỏi đã trả lời không được chấm điểm thêm lần nữa khi bấm liên tiếp.',
 'Khi hoàn thành câu thứ năm, chương trình không mở thêm câu hỏi mà chuyển đến màn hình kết quả, hiển thị tổng điểm trên thang 100 và số câu đúng. Từ 60 điểm trở lên, màn hình ghi “Hoàn thành”; dưới 60 điểm, màn hình ghi “Hãy cố gắng thêm”. Nút “Làm lại” sẽ đưa toàn bộ dữ liệu về trạng thái ban đầu để chơi lượt mới.'
 ],twist:'Giáo viên muốn các câu hỏi xuất hiện theo thứ tự ngẫu nhiên trong mỗi lượt, nhưng không câu nào xuất hiện hai lần. Những nhiệm vụ nào cần bổ sung hoặc thay đổi?'},
 {id:'vending',n:3,title:'Máy bán hàng tự động',short:'Chọn đồ uống, thanh toán, tính tiền thừa và tồn kho.',type:'Mô phỏng giao dịch',stars:4,stage:'Nâng cao',image:2,
 scenario:'Một cửa hàng muốn tạo chương trình Scratch mô phỏng máy bán hàng tự động. Máy phải phục vụ người mua mà không cần nhân viên trực tiếp thao tác.',
 paragraphs:[
 'Khi bắt đầu, máy hiển thị ba sản phẩm: nước suối giá 5.000 đồng (còn 2 chai), nước cam giá 10.000 đồng (còn 3 chai) và sữa giá 12.000 đồng (còn 1 hộp). Bên cạnh mỗi sản phẩm có tên, giá và số lượng còn lại để người mua quan sát.',
 'Người mua nhấp chuột chọn một sản phẩm. Máy hiển thị lại tên và giá của sản phẩm đã chọn. Nếu sản phẩm đã hết hàng, máy thông báo “Sản phẩm đã hết” và mời người mua chọn sản phẩm khác; máy không yêu cầu thanh toán trong trường hợp này.',
 'Với sản phẩm còn hàng, máy yêu cầu người mua nhập số tiền thanh toán. Nếu tiền nhập vào nhỏ hơn giá bán, máy thông báo “Chưa đủ tiền” và cho phép nhập lại. Nếu tiền bằng hoặc lớn hơn giá, máy xác nhận giao sản phẩm và tính số tiền thừa cần trả. Một lần mua chỉ giao đúng một sản phẩm.',
 'Sau giao dịch thành công, máy giảm số lượng tồn kho của sản phẩm đó đi 1, cập nhật thông tin trên màn hình và hiện lời cảm ơn. Khách hàng có thể tiếp tục chọn sản phẩm khác hoặc bấm “Kết thúc” để dừng chương trình. Máy không được cho số lượng tồn kho xuống dưới 0.'
 ],twist:'Cửa hàng bổ sung ưu đãi: mua hai sản phẩm liên tiếp trong cùng lượt được giảm 2.000 đồng ở sản phẩm thứ hai. Em sẽ bổ sung nhiệm vụ nào và nhiệm vụ nào đang có phải phối hợp với nó?'},
 {id:'garden',n:4,title:'Khu vườn thông minh',short:'Chăm sóc cây theo ngày, điều chỉnh nước và ánh sáng.',type:'Mô phỏng khoa học',stars:4,stage:'Nâng cao',image:3,
 scenario:'Một nhóm học sinh muốn thiết kế chương trình Scratch mô phỏng quá trình trồng cây. Người chơi có nhiệm vụ chăm sóc cây đúng cách để cây lớn lên qua từng ngày.',
 paragraphs:[
 'Khi bắt đầu, màn hình xuất hiện một chậu cây ở giai đoạn “Hạt giống”, số ngày là 1, lượng nước là 0 và mức ánh sáng là 0. Bên cạnh chậu cây có các nút “Tưới nước”, “Bổ sung ánh sáng” và “Chuyển sang ngày mới”. Các chỉ số nước và ánh sáng đều được hiển thị trên màn hình.',
 'Mỗi lần nhấn nút “Tưới nước”, lượng nước tăng 1 đơn vị; mỗi lần nhấn “Bổ sung ánh sáng”, mức ánh sáng tăng 1 đơn vị. Trong một ngày, người chơi có thể lựa chọn các nút nhiều lần. Khi muốn kết thúc ngày, người chơi nhấn “Chuyển sang ngày mới”.',
 'Nếu trong ngày cây nhận từ 1 đến 2 đơn vị nước và ít nhất 1 đơn vị ánh sáng, cây phát triển thêm một giai đoạn: Hạt giống → Mầm → Cây non → Ra hoa. Nếu không đủ nước hoặc ánh sáng, cây giữ nguyên giai đoạn và chương trình giải thích điều còn thiếu. Nếu lượng nước lớn hơn 2, cây không phát triển và màn hình cảnh báo “Tưới quá nhiều nước”.',
 'Sau mỗi lần đánh giá cuối ngày, chương trình tăng số ngày lên 1, đưa lượng nước và ánh sáng về 0 để người chơi chăm sóc cho ngày tiếp theo. Khi đạt giai đoạn “Ra hoa”, chương trình hiển thị lời chúc mừng và thông báo đã hoàn thành nhiệm vụ. Người chơi có thể bắt đầu một lượt trồng cây mới.'
 ],twist:'Chương trình cần lưu lại số ngày cây bị tưới quá nhiều nước và hiển thị thống kê khi cây ra hoa. Em sẽ thay đổi sơ đồ phân rã như thế nào?'},
 {id:'planner',n:5,title:'Trợ lý quản lý học tập',short:'Lập kế hoạch, cập nhật nhiệm vụ và theo dõi tiến độ.',type:'Ứng dụng quản lý',stars:5,stage:'Thử thách',image:4,
 scenario:'Lớp 5 muốn có một ứng dụng nhỏ giúp mỗi học sinh tự quản lý các việc cần hoàn thành trong ngày. Em được giao đề xuất bản thiết kế chương trình bằng Scratch.',
 paragraphs:[
 'Khi mở chương trình, màn hình hiển thị ngày hiện tại, danh sách công việc trong ngày và phần tiến độ học tập. Nếu chưa có công việc, màn hình ghi “Chưa có nhiệm vụ nào” và tiến độ là 0%.',
 'Người dùng có thể bấm “Thêm nhiệm vụ”, nhập tên công việc và lựa chọn mức ưu tiên “Cao”, “Vừa” hoặc “Thấp”. Sau khi xác nhận, công việc mới xuất hiện trong danh sách với trạng thái “Chưa hoàn thành”. Chương trình chỉ chấp nhận tên không để trống và cho phép tối đa 6 công việc trong một ngày.',
 'Khi hoàn thành một công việc, người dùng nhấn vào công việc đó để chuyển trạng thái sang “Đã hoàn thành”. Nếu nhấn lại, trạng thái trở về “Chưa hoàn thành”. Mỗi công việc chỉ được tính một lần vào số lượng đã hoàn thành. Người dùng cũng có thể xóa công việc không còn cần thiết khỏi danh sách.',
 'Màn hình liên tục hiển thị số nhiệm vụ đã hoàn thành trên tổng số nhiệm vụ, đồng thời tính tỷ lệ hoàn thành dưới dạng phần trăm. Khi danh sách còn công việc, tỷ lệ được tính dựa trên số việc thực sự đang có; nếu danh sách trống, tiến độ là 0%. Khi tất cả công việc đều hoàn thành và danh sách không trống, chương trình hiển thị thông báo chúc mừng.',
 'Người dùng có thể chọn “Ngày mới” để bắt đầu một danh sách mới. Trước khi xóa dữ liệu ngày cũ, chương trình yêu cầu xác nhận để tránh làm mất công việc do nhấp nhầm.'
 ],twist:'Giáo viên muốn người dùng xem riêng các việc “Chưa hoàn thành” và sắp xếp các việc theo mức ưu tiên. Em sẽ thêm những nhiệm vụ nào và chúng cần dùng dữ liệu từ đâu?'}
];

 <div class="brief-row"><div class="brief"><b>🎯 Mục tiêu học tập</b><p>Hiểu yêu cầu của một sản phẩm, xác định các chức năng chính, chia thành nhiệm vụ con phù hợp và kiểm tra sơ đồ theo tiêu chí <strong>ĐỦ – RÕ – VỪA – KẾT NỐI</strong>. Không cần viết code ngay.</p></div>${profileBlock()}</div>

function taskContent(c,i,t){const data=state.challenges[i];const a=data.answers;let body='';
 if(t===0){body=`<p>Đọc kỹ toàn bộ phần “Mô tả hoạt động”, sau đó diễn đạt bằng lời của em. Không cần viết mã lệnh hoặc đặt tên các chức năng ngay ở bước này.</p><div class="field"><label>1. Mục tiêu cuối cùng của chương trình là gì?</label><textarea class="answer" data-answer="goal" placeholder="Theo em, sản phẩm hoàn chỉnh phải làm được điều gì?">${esc(a.goal)}</textarea></div><div class="field-grid"><div class="field"><label>2. Người dùng thao tác hoặc nhập những gì?</label><textarea class="answer" data-answer="inputs" placeholder="Những cách tương tác nào được mô tả?">${esc(a.inputs)}</textarea></div><div class="field"><label>3. Chương trình phản hồi hoặc hiển thị những gì?</label><textarea class="answer" data-answer="rules" placeholder="Chương trình thay đổi, kiểm tra hoặc hiển thị điều gì?">${esc(a.rules)}</textarea></div></div><div class="field"><label>4. Chọn một trường hợp đặc biệt cần xử lý</label><textarea class="answer" data-answer="exception" placeholder="Nếu điều kiện không thỏa mãn hoặc người dùng thao tác sai, điều gì xảy ra?">${esc(a.exception)}</textarea></div>`}
 if(t===1){body=`<p>Từ những gì vừa phân tích, hãy tự nhóm công việc thành các <strong>nhiệm vụ chính</strong>. Tên nhiệm vụ nên thể hiện một chức năng có ý nghĩa; không dùng tên khối lệnh Scratch hoặc thao tác nhấp chuột.</p><div class="tablewrap" data-table="main">${tableHTML(i,'main')}</div><div class="table-actions">${action('add-main','＋ Thêm hàng','green small')}${action('remove-main','－ Bớt hàng','small')}<small>Em được phép thêm hoặc bớt hàng tùy cách phân rã.</small></div>`}
 if(t===2){body=`<p>Hãy tạo các ô cho chức năng chính và các nhiệm vụ con, đổi tên từng ô, kéo thả chúng đến vị trí phù hợp và dùng mũi tên để biểu diễn quan hệ phân cấp. <strong>Em tự quyết định số lượng ô.</strong></p><div class="diagram-help"><span class="legend"><i class="swatch root"></i>Sản phẩm</span><span class="legend"><i class="swatch main"></i>Nhiệm vụ chính (xanh lá nhạt)</span><span class="legend"><i class="swatch sub"></i>Nhiệm vụ con (cam nhạt)</span><span class="legend">→ Mũi tên: quan hệ phân cấp</span></div><div class="diagram-toolbar">${action('add-main-node','＋ Nhiệm vụ chính','green small')}${action('add-sub-node','＋ Nhiệm vụ con','small')}${action('add-edge','↗ Thêm mũi tên','small')}${action('remove-node','− Bớt hình','small')}${action('remove-edge','− Bớt mũi tên','small')}${action('reset-diagram','↺ Đặt lại sơ đồ','danger small')}</div><div class="draw-layout"><div><div class="diagram-container" id="diagramFrame"><svg id="graphSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ phân rã có thể kéo thả"><defs><marker id="graphArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376a9a"/></marker><marker id="graphArrowSel" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e79645"/></marker></defs><g id="graphEdges"></g><g id="graphNodes"></g></svg></div><div class="drawing-status" id="graphStatus">Chọn “Thêm” để tạo ô. Nhấp ô để đổi tên, kéo ô để sắp xếp.</div><div class="draw-caption">↘ Kéo góc dưới bên phải của khung để thay đổi kích thước vùng làm việc; cuộn bên trong khung để xem sơ đồ lớn. Nhấp hai lần vào ô để sửa tên.</div></div><aside class="inspector"><h4>✏️ Chỉnh sửa đối tượng</h4><div id="inspectorEmpty"><p>Chọn một ô hoặc mũi tên trong sơ đồ để chỉnh sửa. Ô “Sản phẩm” không thể xóa.</p></div><div id="inspectorNode" hidden><label>Tên nhiệm vụ</label><textarea id="inspectorText" placeholder="Tên hình khối"></textarea><label>Loại nhiệm vụ</label><select id="inspectorKind"><option value="root">Sản phẩm</option><option value="main">Nhiệm vụ chính</option><option value="sub">Nhiệm vụ con</option></select><label>Kiểu hình khối</label><select id="inspectorShape"><option value="round">Chữ nhật bo góc</option><option value="rect">Chữ nhật</option><option value="ellipse">Hình elip</option><option value="diamond">Hình thoi</option></select><label>Chiều rộng: <span id="rangeWidthLabel"></span></label><input type="range" id="inspectorWidth" min="160" max="350" step="10"><label>Chiều cao: <span id="rangeHeightLabel"></span></label><input type="range" id="inspectorHeight" min="58" max="160" step="2">${action('remove-selected','🗑 Xóa đối tượng','danger small')}</div><div id="inspectorEdge" hidden><p id="edgeSummary"></p>${action('remove-selected','🗑 Xóa mũi tên','danger small')}</div></aside></div>`}
 if(t===3){body=`<p>Chọn một số nhiệm vụ con từ sơ đồ của em. Mô tả rõ nhiệm vụ ấy thuộc phần nào và làm sao biết rằng nhiệm vụ đã hoàn thành. Không cần liệt kê thao tác kéo khối lệnh.</p><div class="tablewrap" data-table="sub">${tableHTML(i,'sub')}</div><div class="table-actions">${action('add-sub','＋ Thêm hàng','green small')}${action('remove-sub','－ Bớt hàng','small')}<small>Đảm bảo nhiệm vụ con có ý nghĩa rõ ràng.</small></div>`}
 if(t===4){body=`<p>Kiểm tra sơ đồ theo bốn tiêu chí trong tài liệu đọc, sau đó lý giải cách các nhiệm vụ phối hợp với nhau. Thử thay đổi kế hoạch theo yêu cầu mới.</p><div class="checkgrid">${CRITERIA.map(([name,desc],k)=>`<label class="checkitem"><input type="checkbox" data-review="${k}" ${data.review[k]?'checked':''}><span><b>${name}</b> – ${desc}</span></label>`).join('')}</div><div class="field"><label>Nêu một cặp nhiệm vụ có quan hệ phụ thuộc và giải thích vì sao</label><textarea class="answer" data-answer="dependency" placeholder="Nhiệm vụ nào cần kết quả của nhiệm vụ nào? Vì sao?">${esc(a.dependency)}</textarea></div><div class="twist"><b>🌟 Yêu cầu mới – Thử thách dành cho CLB Tin học Tài năng</b><div>${esc(c.twist)}</div></div><div class="field"><label>Em đề xuất thay đổi hoặc bổ sung những nhiệm vụ nào? Giải thích</label><textarea class="answer" data-answer="improve" placeholder="Viết tên các nhiệm vụ cần sửa và lý do. Có thể cập nhật lại sơ đồ ở Task 3.">${esc(a.improve)}</textarea></div>`}
 return `<div class="task-body" id="taskBody${t}" ${!expanded[t]?'hidden':''}>${body}<div class="task-end"><label class="done-control"><input type="checkbox" data-done="${t}" ${data.done[t]?'checked':''}> Đánh dấu Task ${t+1} đã hoàn thành</label><span class="tip">Đánh dấu hoàn thành không đồng nghĩa với được chấm đúng.</span></div></div>`}
function tableHTML(i,kind){const rows=kind==='main'?state.challenges[i].mainRows:state.challenges[i].subRows;const header=kind==='main'?['STT','Nhiệm vụ chính','Yêu cầu được đáp ứng']:['STT','Thuộc nhiệm vụ chính','Nhiệm vụ con','Dấu hiệu hoàn thành'];let w=kind==='main'?'':`<colgroup><col style="width:52px"><col style="width:27%"><col style="width:35%"><col style="width:38%"></colgroup>`;return `<table class="worktable">${w}<thead><tr>${header.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,k)=>`<tr><td>${k+1}</td>${(kind==='main'?['name','why']:['parent','name','result']).map(key=>`<td><textarea class="table-area" data-table-kind="${kind}" data-row="${k}" data-key="${key}" placeholder="${key==='why'?'Yêu cầu liên quan':key==='result'?'Kết quả quan sát được':key==='parent'?'Tên nhiệm vụ chính':'Nhập tên nhiệm vụ'}">${esc(r[key])}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table>`}
function taskCard(c,i,t){const [name,desc]=taskSteps()[t],done=state.challenges[i].done[t],exp=!!expanded[t];return `<section class="task" id="task${t}"><button type="button" class="task-head" data-action="toggle-task" data-step="${t}" aria-expanded="${exp}"><span class="chev">⌄</span><span class="task-number">${t+1}</span><span class="task-head-title"><b>Task ${t+1} · ${name}</b><small>${desc}</small></span><span class="task-status ${done?'done':''}">${done?'✓ Đã xong':'Chưa xong'}</span></button>${taskContent(c,i,t)}</section>`}
function renderDetail(i){const c=CHALLENGES[i],d=state.challenges[i];return `<div class="breadcrumb"><button data-action="home">⌂ Trang chủ</button><span>›</span><span>Challenge ${i+1}</span><span>›</span><span>${esc(c.title)}</span></div><section class="detail-hero"><div class="detail-art"><img src="${img(c.image)}" alt="Minh họa chibi chủ đề ${esc(c.title)}"></div><div class="detail-info"><span class="eyebrow">CHALLENGE ${i+1} · BÀI 02 – DECOMPOSITION</span><h1>${esc(c.title)}</h1><p>Em là người thiết kế chương trình. Hãy đọc yêu cầu hoạt động rồi tự xác định các nhiệm vụ chính, nhiệm vụ con và vẽ sơ đồ phân rã.</p><div class="detail-chips"><span class="chip">${stars(c.stars)} · ${esc(c.stage)}</span><span class="chip">${esc(c.type)}</span><span class="chip">🧩 5 Task</span></div><div class="row" style="margin-top:3px">${action('pdf','⬇ Tải bài làm PDF','primary')}${action('home','← Tất cả Challenge')}</div></div></section>
 <div class="challenge-layout"><div class="challenge-main"><section class="info-panel"><h2><span class="i">🎯</span>Tình huống</h2><div class="story"><p>${esc(c.scenario)}</p></div></section><section class="info-panel"><h2><span class="i">🎮</span>Mô tả hoạt động của chương trình</h2>${c.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</section><div class="task-area-top"><div><h2>🚀 Các nhiệm vụ của em</h2><p>Mở từng Task bằng mũi tên bên trái; em có thể làm và chỉnh sửa theo thứ tự phù hợp.</p></div><span class="counter">${numDone(i)}/5 Task</span></div>${taskSteps().map((_,t)=>taskCard(c,i,t)).join('')}<div class="row" style="justify-content:space-between;margin-top:19px">${action('prev','← Challenge trước')}${action('pdf','⬇ Tải PDF bài làm','violet')}${action('next','Challenge tiếp →')}</div></div><aside class="sidebar"><div class="side-card"><h3>📍 Tiến độ thử thách</h3><div style="font-size:27px;font-weight:900;color:#287cbd">${numDone(i)}/5 <span style="font-size:13px;color:#7891a5">Task</span></div><div class="pbar"><div style="width:${numDone(i)*20}%"></div></div><p>Em có thể quay lại chỉnh sửa và tiếp tục làm bài trên thiết bị này.</p>${action('backup','💾 Sao lưu để mang sang máy khác','small')}</div><div class="side-card"><h3>🎨 Chú giải sơ đồ</h3><div class="side-check"><i class="swatch root"></i> Ô tím nhạt: toàn bộ sản phẩm</div><div class="side-check"><i class="swatch main"></i> Ô xanh lá nhạt: nhiệm vụ chính</div><div class="side-check"><i class="swatch sub"></i> Ô cam nhạt: nhiệm vụ con</div><div class="side-check">↗ Mũi tên: nhiệm vụ lớn được chia thành phần nhỏ</div></div><div class="side-card"><h3>✅ Bốn tiêu chí quan trọng</h3>${CRITERIA.map(([k,v])=>`<p><b style="color:#2474af">${k}:</b> ${v}</p>`).join('')}<hr style="border:0;border-top:1px solid #e4edf6;margin:12px 0"><p><b>Lưu ý:</b> Có thể tồn tại nhiều cách phân rã hợp lý cho cùng một chương trình.</p></div></aside></div>`}
function renderReader(){return `<div class="breadcrumb"><button data-action="home">⌂ Trang chủ</button><span>›</span><span>Tài liệu đọc</span></div><div class="reader-heading"><span class="eyebrow" style="color:#2575bd">CLB TIN HỌC TÀI NĂNG • KHỐI 5</span><h1>📘 Tài liệu đọc – Bài 2: Phân rã bài toán</h1><p>Đọc toàn bộ nội dung kiến thức, ví dụ và sơ đồ ngay tại đây. Em có thể dùng thanh mục lục để di chuyển nhanh giữa các phần.</p></div><div class="reader-toolbar"><div class="row">${action('home','← Về chọn Challenge')}</div><span class="counter">11 phần kiến thức · Nội dung đầy đủ</span></div><nav class="reader-nav" aria-label="Mục lục tài liệu">${READING_NAV}</nav><article class="reader-main" id="reader-content">${READING_HTML}</article><div class="row" style="justify-content:center;margin-top:16px">${action('home','← Quay về 5 Challenge','primary')}</div>`}
function render(){qs('.top-actions').innerHTML=topButtons();$('app').innerHTML=active===null?renderHome():active==='reading'?renderReader():renderDetail(active);if(Number.isInteger(active)){renderGraph();growTextareas()}save();window.scrollTo({top:0,behavior:'instant'})}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),20000)}
function fileSafe(s){return String(s||'Chua_nhap').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,50)||'Chua_nhap'}
function filename(ext){return `${fileSafe(state.student.clazz)}_${fileSafe(state.student.name)}_${active!==null&&active!=='reading'?'Challenge_'+(active+1)+'_':''}Bai_2_Phan_ra_bai_toan.${ext}`}
function grow(el){if(!el||el.tagName!=='TEXTAREA')return;el.style.height='auto';el.style.height=Math.max(el.classList.contains('table-area')?55:85,el.scrollHeight+3)+'px'}
function growTextareas(){document.querySelectorAll('#app textarea').forEach(grow)}
function showModal(){const root=$('modalRoot');root.innerHTML=`<div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Yêu cầu nhập thông tin học sinh"><div class="modal"><h2>👤 Điền thông tin trước khi tải PDF</h2><p>Em cần nhập đầy đủ <b>Họ và tên</b> và <b>Lớp</b> để bài làm được ghi đúng tên khi nộp.</p><div class="field"><label>Họ và tên học sinh</label><input id="modalName" class="input" placeholder="Họ và tên" value="${esc(state.student.name)}"></div><div class="field"><label>Lớp</label><input id="modalClass" class="input" placeholder="Ví dụ: 5A1" value="${esc(state.student.clazz)}"></div><div class="modal-actions"><button class="btn" data-action="modal-close">Đóng</button><button class="btn primary" data-action="modal-submit">Lưu và tải PDF</button></div></div></div>`;const first=!state.student.name?$('modalName'):$('modalClass');setTimeout(()=>first?.focus(),70)}
function validateProfile(){if(!state.student.name.trim()||!state.student.clazz.trim()){showModal();return false}return true}
function svgEl(tag,attrs={},parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent?.appendChild(e);return e}
function diagram(){return state.challenges[active].diagram}
function nodeBy(id){return diagram().nodes.find(n=>n.id===id)}
function nodeColor(n){return n.kind==='root'?['#eee1ff','#9970cf']:n.kind==='main'?['#dff6ce','#68b352']:['#ffedd5','#e9a04a']}
function wrapNode(text,maxWidth){const words=String(text||'Chưa đặt tên').split(/\s+/),chars=Math.max(9,Math.floor(maxWidth/10)),lines=[];let current='';for(let word of words){if(!word)continue;if(word.length>chars){if(current){lines.push(current);current=''}while(word.length>chars){lines.push(word.slice(0,chars));word=word.slice(chars)}}const next=current?current+' '+word:word;if(next.length>chars&&current){lines.push(current);current=word}else current=next}if(current)lines.push(current);return lines.slice(0,6)}
function endPoint(a,b){const dx=b.x+b.w/2-(a.x+a.w/2),dy=b.y+b.h/2-(a.y+a.h/2);const x=a.x+a.w/2,y=a.y+a.h/2;if(!dx&&!dy)return{x,y};const k=Math.min((a.w/2+4)/Math.max(1,Math.abs(dx)),(a.h/2+4)/Math.max(1,Math.abs(dy)));return{x:x+dx*k,y:y+dy*k}}
function diagramH(){return Math.max(760,...diagram().nodes.map(n=>n.y+n.h+120))}
function renderGraph(){const svg=$('graphSvg');if(!svg||!Number.isInteger(active))return;const d=diagram();svg.setAttribute('viewBox',`0 0 1180 ${diagramH()}`);svg.style.height=diagramH()+'px';const edges=$('graphEdges'),nodes=$('graphNodes');edges.replaceChildren();nodes.replaceChildren();d.edges.forEach(e=>{const a=nodeBy(e.from),b=nodeBy(e.to);if(!a||!b)return;const p=endPoint(a,b),q=endPoint(b,a),is=selected?.type==='edge'&&selected.id===e.id;const g=svgEl('g',{'data-edge':e.id},edges);svgEl('path',{d:`M ${p.x} ${p.y} L ${q.x} ${q.y}`,stroke:is?'#e79645':'#376a9a','stroke-width':is?5:3.3,fill:'none','marker-end':is?'url(#graphArrowSel)':'url(#graphArrow)'},g);svgEl('path',{d:`M ${p.x} ${p.y} L ${q.x} ${q.y}`,stroke:'transparent','stroke-width':23,fill:'none',class:'edgehit'},g)});d.nodes.forEach(n=>{const g=svgEl('g',{'data-node':n.id,class:'nodeg'},nodes),is=selected?.type==='node'&&selected.id===n.id,[fill,stroke]=nodeColor(n);const attrs={fill,stroke:is?'#2273bd':stroke,'stroke-width':is?4.2:2.6};if(n.shape==='ellipse')svgEl('ellipse',{cx:n.x+n.w/2,cy:n.y+n.h/2,rx:n.w/2,ry:n.h/2,...attrs},g);else if(n.shape==='diamond')svgEl('polygon',{points:`${n.x+n.w/2},${n.y} ${n.x+n.w},${n.y+n.h/2} ${n.x+n.w/2},${n.y+n.h} ${n.x},${n.y+n.h/2}`,...attrs},g);else svgEl('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:n.shape==='rect'?4:19,...attrs},g);const words=wrapNode(n.text,n.w-22),size=n.kind==='root'?20:17,lh=size+6,start=n.y+n.h/2-(words.length-1)*lh/2;const txt=svgEl('text',{'text-anchor':'middle','font-size':size,'font-weight':n.kind==='root'?900:800,fill:'#29445c','pointer-events':'none'},g);words.forEach((line,i)=>svgEl('tspan',{x:n.x+n.w/2,y:start+i*lh+size*.3},txt).textContent=line)});updateInspector()}
function updateInspector(){const a=$('inspectorNode'),b=$('inspectorEdge'),c=$('inspectorEmpty');if(!a)return;const node=selected?.type==='node'?nodeBy(selected.id):null,edge=selected?.type==='edge'?diagram().edges.find(x=>x.id===selected.id):null;a.hidden=!node;b.hidden=!edge;c.hidden=!!node||!!edge;if(node){const textEl=$('inspectorText');if(document.activeElement!==textEl)textEl.value=node.text;$('inspectorKind').value=node.kind;$('inspectorKind').disabled=node.id==='root';$('inspectorShape').value=node.shape;$('inspectorWidth').value=node.w;$('inspectorHeight').value=node.h;$('rangeWidthLabel').textContent=node.w+' px';$('rangeHeightLabel').textContent=node.h+' px';a.querySelector('[data-action="remove-selected"]').disabled=node.id==='root'}if(edge){$('edgeSummary').textContent=`${nodeBy(edge.from)?.text||''} → ${nodeBy(edge.to)?.text||''}`}}
function addNode(kind){const d=diagram(),num=d.nodes.filter(n=>n.kind===kind).length,main=kind==='main';const n={id:'n'+d.seq++,kind,shape:'round',x:main?75+(num%3)*355:65+(num%4)*275,y:main?218+Math.floor(num/3)*150:425+Math.floor(num/4)*143,w:main?260:234,h:78,text:main?'Nhiệm vụ chính mới':'Nhiệm vụ con mới'};d.nodes.push(n);selected={type:'node',id:n.id};linkMode=false;linkStart=null;renderGraph();save();$('inspectorText')?.focus();$('inspectorText')?.select();notify(`Đã thêm ô ${main?'xanh lá':'cam nhạt'}. Hãy đổi tên nhiệm vụ.`)}

// Native offline PDF exporter: render formatted answers and vector graph to an A4 canvas,

const PDF_W=1240,PDF_H=1754,PDF_MARGIN=54,PDF_END=PDF_H-112;
let pages=[],pageCtx,py,pno=0;
function ctxFont(size=22,weight=400){pageCtx.font=`${weight} ${size}px "Segoe UI","Noto Sans","DejaVu Sans",Arial,sans-serif`}
function pdfPage(){const can=document.createElement('canvas');can.width=PDF_W;can.height=PDF_H;const ctx=can.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,PDF_W,PDF_H);pages.push(can);pageCtx=ctx;pno=pages.length;py=112;ctx.fillStyle='#1e5e9d';ctx.fillRect(0,0,PDF_W,72);ctx.fillStyle='#fff';ctxFont(24,900);ctx.fillText('CLB TIN HỌC TÀI NĂNG  •  BÀI 2: PHÂN RÃ BÀI TOÁN',PDF_MARGIN,43);ctx.fillStyle='#637c91';ctx.fillRect(PDF_MARGIN,PDF_H-90,PDF_W-PDF_MARGIN*2,2)}
function pdfEnsure(h){if(py+h>PDF_END)pdfPage()}
function pdfText(s,x,y,size=22,col='#263e55',weight=400){pageCtx.fillStyle=col;ctxFont(size,weight);pageCtx.textBaseline='top';pageCtx.fillText(String(s??''),x,y)}
function wrapPDF(text,width,size=22,weight=400){ctxFont(size,weight);const output=[];for(const para of String(text??'').split(/\n/)){if(!para.trim()){output.push('');continue}let run='';for(let word of para.trim().split(/\s+/)){while(pageCtx.measureText(word).width>width){if(run){output.push(run);run=''}let chunk='';for(const char of word){if(chunk&&pageCtx.measureText(chunk+char).width>width)break;chunk+=char}output.push(chunk);word=word.slice(chunk.length)}if(!word)continue;const s=run?run+' '+word:word;if(run&&pageCtx.measureText(s).width>width){output.push(run);run=word}else run=s}if(run)output.push(run)}return output.length?output:['']}
function pdfLines(text,x,y,width,size=22,col='#263e55',weight=400,lh=32){const rows=wrapPDF(text,width,size,weight);rows.forEach((s,i)=>pdfText(s,x,y+i*lh,size,col,weight));return rows.length*lh}
function pdfBox(x,y,w,h,fill='#fff',stroke='#d3e3f0',r=12){pageCtx.beginPath();if(pageCtx.roundRect)pageCtx.roundRect(x,y,w,h,r);else pageCtx.rect(x,y,w,h);pageCtx.fillStyle=fill;pageCtx.fill();if(stroke){pageCtx.strokeStyle=stroke;pageCtx.lineWidth=2;pageCtx.stroke()}}
function pdfHeading(title,sub=''){const h=sub?86:65;pdfEnsure(h+16);pdfBox(PDF_MARGIN,py,PDF_W-PDF_MARGIN*2,h,'#e9f4ff','#d3e6f6',12);pdfLines(title,PDF_MARGIN+17,py+12,PDF_W-PDF_MARGIN*2-30,26,'#1d5389',850,32);if(sub)pdfLines(sub,PDF_MARGIN+17,py+51,PDF_W-PDF_MARGIN*2-30,18,'#627f9a',500,23);py+=h+17}
function pdfParagraph(text,opts={}){const x=PDF_MARGIN,width=PDF_W-2*PDF_MARGIN,fs=opts.size||22,lines=wrapPDF(text,width-22,fs,opts.weight||400),lh=opts.lh||31;let ix=0;while(ix<lines.length){let space=PDF_END-py;let count=Math.max(1,Math.floor((space-18)/lh));if(count<2){pdfPage();count=Math.max(1,Math.floor((PDF_END-py-18)/lh))}const n=Math.min(count,lines.length-ix);for(let j=0;j<n;j++)pdfText(lines[ix+j],x+7,py+j*lh,fs,opts.color||'#334b65',opts.weight||400);py+=n*lh+6;ix+=n}py+=opts.after??11}
function pdfAnswer(label,value){const width=PDF_W-2*PDF_MARGIN,lines=wrapPDF(String(value||'').trim()||'Chưa trả lời',width-40,21),labelLines=wrapPDF(label,width-42,21,800),h=25+labelLines.length*28+Math.max(44,lines.length*30+11);pdfEnsure(Math.min(h+13,PDF_END-110));if(h+py<=PDF_END){pdfBox(PDF_MARGIN,py,width,h,'#fff','#d6e4f1');let y=py+10;labelLines.forEach(l=>{pdfText(l,PDF_MARGIN+16,y,21,'#255c89',820);y+=28});lines.forEach(l=>{pdfText(l,PDF_MARGIN+18,y+7,21,'#344d66');y+=30});py+=h+12}else{pdfParagraph(label,{weight:800,color:'#235d90'});pdfParagraph(String(value||'').trim()||'Chưa trả lời')}}
function pdfTable(headers,rows,widths){const totalW=PDF_W-PDF_MARGIN*2,wd=widths.map(x=>x*totalW),pad=12,headH=57;const drawHeader=()=>{pdfEnsure(headH+70);pdfBox(PDF_MARGIN,py,totalW,headH,'#e7f3ff','#d1e4f1',8);let x=PDF_MARGIN;headers.forEach((h,i)=>{pdfLines(h,x+pad,py+11,wd[i]-pad*2,19,'#255c86',830,26);x+=wd[i]});py+=headH};drawHeader();rows.forEach((row,index)=>{const lines=row.map((cell,j)=>wrapPDF(String(cell||'—'),wd[j]-pad*2,19));const hh=Math.max(52,...lines.map(x=>x.length*26+22));if(py+hh>PDF_END){pdfPage();drawHeader()}pdfBox(PDF_MARGIN,py,totalW,hh,index%2?'#f7fbff':'#fff','#e0eaf5',0);let x=PDF_MARGIN;lines.forEach((a,j)=>{a.forEach((s,ii)=>pdfText(s,x+pad,py+9+ii*26,19,'#314962'));x+=wd[j]});py+=hh});py+=17}
function drawPDFGraph(){const d=diagram(),contentW=PDF_W-PDF_MARGIN*2,worldH=diagramH(),scale=contentW/1180,gh=Math.min(worldH*scale,1030);if(py+gh+95>PDF_END)pdfPage();pdfHeading('Task 3 · Sơ đồ phân rã đã thiết kế');if(py+gh+22>PDF_END)pdfPage();pdfBox(PDF_MARGIN,py,contentW,gh+15,'#f9fcff','#a9c7e6');pageCtx.save();pageCtx.translate(PDF_MARGIN+5,py+8);const s=Math.min((contentW-10)/1180,(gh-12)/worldH);pageCtx.scale(s,s);d.edges.forEach(e=>{const a=nodeBy(e.from),b=nodeBy(e.to);if(!a||!b)return;const p=endPoint(a,b),q=endPoint(b,a);pageCtx.beginPath();pageCtx.moveTo(p.x,p.y);pageCtx.lineTo(q.x,q.y);pageCtx.strokeStyle='#366a97';pageCtx.lineWidth=3;pageCtx.stroke();const angle=Math.atan2(q.y-p.y,q.x-p.x);pageCtx.fillStyle='#366a97';pageCtx.beginPath();pageCtx.moveTo(q.x,q.y);pageCtx.lineTo(q.x-16*Math.cos(angle-.55),q.y-16*Math.sin(angle-.55));pageCtx.lineTo(q.x-16*Math.cos(angle+.55),q.y-16*Math.sin(angle+.55));pageCtx.fill()});d.nodes.forEach(n=>{const [fill,stroke]=nodeColor(n);pageCtx.fillStyle=fill;pageCtx.strokeStyle=stroke;pageCtx.lineWidth=3;pageCtx.beginPath();if(n.shape==='ellipse')pageCtx.ellipse(n.x+n.w/2,n.y+n.h/2,n.w/2,n.h/2,0,0,Math.PI*2);else if(n.shape==='diamond'){pageCtx.moveTo(n.x+n.w/2,n.y);pageCtx.lineTo(n.x+n.w,n.y+n.h/2);pageCtx.lineTo(n.x+n.w/2,n.y+n.h);pageCtx.lineTo(n.x,n.y+n.h/2);pageCtx.closePath()}else if(n.shape==='round'&&pageCtx.roundRect)pageCtx.roundRect(n.x,n.y,n.w,n.h,17);else pageCtx.rect(n.x,n.y,n.w,n.h);pageCtx.fill();pageCtx.stroke();pageCtx.fillStyle='#23455b';ctxFont(n.kind==='root'?19:17,800);pageCtx.textAlign='center';const ls=wrapNode(n.text,n.w-25),y=n.y+n.h/2-(ls.length-1)*23/2;ls.forEach((txt,k)=>pageCtx.fillText(txt,n.x+n.w/2,y+23*k));pageCtx.textAlign='left'});pageCtx.restore();py+=gh+33}
function pdfHeaderForChallenge(c){pdfEnsure(210);pdfText(`CHALLENGE ${c.n}  ·  ${c.title.toUpperCase()}`,PDF_MARGIN,py,38,'#1e5186',900);py+=58;pdfText(`Họ và tên: ${state.student.name}     |     Lớp: ${state.student.clazz}     |     Ngày: ${state.student.date}`,PDF_MARGIN,py,21,'#55748c',650);py+=42;pdfParagraph('Thiết kế: Hoangntm2 - VSC Tih Times City',{size:18,color:'#7590a6',after:15})}
function buildPDFPages(){pages=[];pdfPage();const c=CHALLENGES[active],d=state.challenges[active],a=d.answers;pdfHeaderForChallenge(c);pdfHeading('Tình huống');pdfParagraph(c.scenario);pdfHeading('Mô tả hoạt động của chương trình');c.paragraphs.forEach(t=>pdfParagraph(t,{size:21}));pdfHeading('Task 1 · Phân tích yêu cầu');pdfAnswer('Mục tiêu chương trình',a.goal);pdfAnswer('Thao tác/đầu vào của người dùng',a.inputs);pdfAnswer('Phản hồi/chức năng chương trình',a.rules);pdfAnswer('Trường hợp đặc biệt',a.exception);pdfHeading('Task 2 · Các nhiệm vụ chính');pdfTable(['STT','NHIỆM VỤ CHÍNH','YÊU CẦU ĐƯỢC ĐÁP ỨNG'],d.mainRows.map((r,i)=>[String(i+1),r.name,r.why]),[.07,.42,.51]);drawPDFGraph();pdfHeading('Task 4 · Nhiệm vụ con và dấu hiệu hoàn thành');pdfTable(['STT','THUỘC NHIỆM VỤ','NHIỆM VỤ CON','DẤU HIỆU HOÀN THÀNH'],d.subRows.map((r,i)=>[String(i+1),r.parent,r.name,r.result]),[.07,.25,.34,.34]);pdfHeading('Task 5 · Đánh giá và mở rộng');pdfParagraph(CRITERIA.map(([k,v],i)=>`${d.review[i]?'✓':'□'} ${k}: ${v}`).join('\n'),{size:20});pdfAnswer('Quan hệ phụ thuộc giữa các nhiệm vụ',a.dependency);pdfParagraph('YÊU CẦU MỚI: '+c.twist,{size:20,color:'#a26420',weight:750});pdfAnswer('Phương án bổ sung hoặc điều chỉnh',a.improve);pdfParagraph(`Các Task đã tự đánh dấu hoàn thành: ${numDone(active)}/5.`,{size:20,color:'#59748d'});pages.forEach((can,i)=>{const ctx=can.getContext('2d');ctx.fillStyle='#6a8298';ctx.font='650 18px "Segoe UI","Noto Sans",Arial';ctx.textBaseline='top';ctx.fillText('Thiết kế: Hoangntm2 - VSC Tih Times City',PDF_MARGIN,PDF_H-68);ctx.textAlign='right';ctx.fillText(`Trang ${i+1} / ${pages.length}`,PDF_W-PDF_MARGIN,PDF_H-68);ctx.textAlign='left'});return pages}
function makePDF(canvases){const enc=new TextEncoder(),chunks=[];let len=0;const offsets=[];const push=x=>{if(typeof x==='string')x=enc.encode(x);chunks.push(x);len+=x.length};const obj=(id,parts)=>{offsets[id]=len;push(id+' 0 obj\n');parts.forEach(push);push('\nendobj\n')};const rawJPEG=c=>{const b64=c.toDataURL('image/jpeg',.87).split(',')[1],a=atob(b64),r=new Uint8Array(a.length);for(let i=0;i<a.length;i++)r[i]=a.charCodeAt(i);return r};const w=595.28,h=841.89,n=canvases.length;push('%PDF-1.4\n');obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);obj(2,[`<< /Type /Pages /Kids [${canvases.map((_,i)=>3+i*3+' 0 R').join(' ')}] /Count ${n} >>`]);canvases.forEach((canvas,i)=>{const page=3+i*3,content=page+1,image=page+2;obj(page,[`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Img ${image} 0 R >> >> /Contents ${content} 0 R >>`]);const contentCode=`q\n${w} 0 0 ${h} 0 0 cm\n/Img Do\nQ\n`;obj(content,[`<< /Length ${enc.encode(contentCode).length} >>\nstream\n`,contentCode,'endstream']);const bytes=rawJPEG(canvas);obj(image,[`<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`,bytes,'\nendstream'])});const xref=len;push(`xref\n0 ${3+n*3}\n0000000000 65535 f \n`);for(let i=1;i<3+n*3;i++)push(String(offsets[i]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<< /Size ${3+n*3} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'})}
let pdfBusy=false;async function exportPDF(){if(pdfBusy||!Number.isInteger(active))return;pdfBusy=true;const btns=[...document.querySelectorAll('[data-action="pdf"]')];btns.forEach(b=>b.disabled=true);try{notify('Đang xuất bài làm PDF có sơ đồ và các câu trả lời…');if(document.fonts?.ready)await document.fonts.ready;const output=makePDF(buildPDFPages());if(output.size<5000)throw Error('Tệp PDF quá nhỏ');download(output,filename('pdf'));notify(`Đã xuất PDF ${pages.length} trang cho Challenge ${active+1}.`)}catch(err){console.error(err);notify('Chưa thể xuất PDF. Hãy dùng trình duyệt Chrome/Edge hoặc sao lưu JSON.');alert('Không thể tạo PDF. Vui lòng thử lại bằng Chrome hoặc Edge.')}finally{pdfBusy=false;btns.forEach(b=>b.disabled=false)}}
setActive(null);
booted=true;
